            margin: 8px 1%;
        }
        .btn {
            width: 100%;
            height: 110px;
            background: #fff;
            border: 1px solid #999;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }
        .label {
            margin-top: 5px;
            font-size: 15px;
            color: #333;
        }

    <div id="videoArea">
        <video id="myVideo" controls="controls"></video>
    </div>

    <button id="backBtn" onclick="goBack()">返回选择页面</button>

    <script type="text/javascript">
        var selectArea, videoArea, backBtn, myVideo;
        window.onload = function(){
            selectArea = document.getElementById("selectArea");
            videoArea = document.getElementById("videoArea");
            backBtn = document.getElementById("backBtn");
            myVideo = document.getElementById("myVideo");
        };

        // 修改：给每个视频路径添加 shiping/ 前缀
        var videoList = [
            "shiping/1/video1.mp4","shiping/1/video2.mp4","shiping/1/video3.mp4","shiping/1/video4.mp4","shiping/1/video5.mp4",
            "shiping/1/video6.mp4","shiping/1/video7.mp4","shiping/1/video8.mp4","shiping/1/video9.mp4","shiping/1/video10.mp4",
            "shiping/1/video11.mp4","shiping/1/video12.mp4","shiping/1/video13.mp4","shiping/1/video14.mp4","shiping/1/video114514.mp4",
        ];

        function playVideo(index){
            // 【优化修复2】增加索引合法性判断，避免数组越界导致的路径错误
            if(index < 1 || index > videoList.length){
                alert("无效的视频选择！");
                return;
            }
            var url = videoList[index-1];
            myVideo.src = url;
            selectArea.style.display = "none";
            videoArea.style.display = "block";
            backBtn.style.display = "block";
            try{myVideo.load();myVideo.play();}catch(e){
                // 【优化修复3】增加播放失败提示，便于排查视频路径问题
                alert("视频播放失败，请检查视频文件路径！");
                console.error("视频播放错误：", e);
            }
        }

        function goBack(){
            videoArea.style.display = "none";
            backBtn.style.display = "none";
            selectArea.style.display = "block";
            try{myVideo.pause(); myVideo.src = "";}catch(e){}
        }
    </script>
